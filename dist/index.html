<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The Cultural Atlas — an atlas of places, collected through the landmarks that give them identity.">
    <title>The Cultural Atlas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%235fb3bd' d='M0 0h32v32H0z'/%3E%3Cpath fill='%23f5e388' d='M6 3h20v26H6z'/%3E%3Cpath fill='%23ec70b7' d='M9 6h14v20H9z'/%3E%3Cpath stroke='%23fff7cd' stroke-width='2' d='M16 6v20M9 16h14'/%3E%3C/svg%3E">
    <link rel="preload" as="image" href="./assets/homepage.svg">
    <link rel="stylesheet" href="./styles/main.css">
    <script type="module" src="./scripts/app.js"></script>
  </head>
  <body>
    <main id="atlas" class="atlas" data-screen="home" aria-label="The Cultural Atlas">
      <section id="home" class="scene scene--active" aria-label="Homepage" data-figma-node="1:1358">
        <img class="scene__art" src="./assets/homepage.svg" width="1512" height="982" alt="The Cultural Atlas. A yellow-framed window on a turquoise paper wall, with pink, blue and turquoise panes and a pot of flowers." fetchpriority="high" draggable="false">
        <button id="enter-window" class="window-target" type="button" aria-label="Open the window and enter the cultural atlas corkboard" aria-controls="corkboard"></button>
      </section>
      <section id="corkboard" class="scene" aria-label="Cultural atlas corkboard" tabindex="-1" aria-hidden="true" inert data-figma-node="1:3">
        <img class="scene__art" src="./assets/corkboard.svg" width="1512" height="982" alt="A corkboard of illustrated landmark cards for Guangzhou, Beijing, Dehong, Shanxi and Shanghai. Red threads connect the cards to a paper map of China. Field bulletin: An atlas of places, collected through the landmarks that give them identity. Follow the red thread. Every city has its own story." decoding="async" draggable="false">
      </section>
    </main>
    <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  </body>
</html>
