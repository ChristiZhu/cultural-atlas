<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The Cultural Atlas — an atlas of places, collected through the landmarks that give them identity.">
    <title>The Cultural Atlas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%235fb3bd' d='M0 0h32v32H0z'/%3E%3Cpath fill='%23f5e388' d='M6 3h20v26H6z'/%3E%3Cpath fill='%23ec70b7' d='M9 6h14v20H9z'/%3E%3Cpath stroke='%23fff7cd' stroke-width='2' d='M16 6v20M9 16h14'/%3E%3C/svg%3E">
    <link rel="preload" as="image" href="./assets/homepage.svg">
    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/map.css">
    <link rel="stylesheet" href="./styles/archive.css">
    <script type="module" src="./scripts/app.js"></script>
  </head>
  <body>
    <main id="atlas" class="atlas" data-screen="home" aria-label="The Cultural Atlas">
      <div class="site-logo" aria-label="CULTURAL ATLAS"><img src="./assets/site-logo.svg" width="176" height="24" alt="CULTURAL ATLAS" draggable="false"></div>
      <section id="home" class="scene scene--active" aria-label="Homepage" data-figma-node="1:1358">
        <img class="scene__art art-canvas" src="./assets/homepage.svg" width="1512" height="982" alt="The Cultural Atlas. A yellow-framed window on a turquoise paper wall, with pink, blue and turquoise panes and a pot of flowers." fetchpriority="high" draggable="false">
        <button id="enter-window" class="window-target" type="button" aria-label="Open the window and enter the cultural atlas corkboard" aria-controls="corkboard"></button>
      </section>
      <section id="corkboard" class="scene" aria-label="Cultural atlas corkboard" tabindex="-1" aria-hidden="true" inert data-figma-node="1:3">
        <div class="board-art" data-svg-src="./assets/corkboard.svg" role="img" aria-label="A corkboard of illustrated landmark cards for Guangzhou, Beijing, Dehong, Shanxi and Shanghai. Red threads connect the cards to a paper map of China. Field bulletin: An atlas of places, collected through the landmarks that give them identity. Follow the red thread. Every city has its own story."></div>
        <button class="art-button guangzhou-card" data-nav="map" type="button" aria-label="Guangzhou — open the map" style="--x:117;--y:155;--w:295;--h:280"></button>
      </section>
      <section id="guangzhou" class="scene map-scene" aria-label="Guangzhou map" tabindex="-1" aria-hidden="true" inert data-figma-node="1:10306" data-collapsed="false" data-category="all">
        <div class="map-ocean" aria-hidden="true"></div>
        <div class="map-viewport" tabindex="0" role="region" aria-label="Explore Guangzhou. Scroll to zoom, drag to pan. Keyboard: arrows to pan, plus and minus to zoom, zero to reset.">
          <div class="map-art"></div>
        </div>
        <div class="panel-art" aria-hidden="true"></div>
        <div id="map-filters" class="map-controls" role="group" aria-label="Map category filters">
          <button class="art-button filter-button" data-filter="food" aria-label="Food" aria-pressed="false" style="--x:40;--y:698;--w:213;--h:52"></button>
          <button class="art-button filter-button" data-filter="architecture" aria-label="Architecture" aria-pressed="false" style="--x:19;--y:775;--w:234;--h:52"></button>
          <button class="art-button filter-button" data-filter="craft" aria-label="Craft" aria-pressed="false" style="--x:40;--y:852;--w:213;--h:52"></button>
        </div>
        <button id="collapse-info" class="art-button collapse-button" aria-label="Collapse information panel" aria-controls="map-filters" aria-expanded="true" style="--x:262;--y:498;--w:45.248;--h:50"></button>
        <button id="expand-info" class="art-button collapse-button" aria-label="Expand information panel" aria-controls="map-filters" aria-expanded="false" style="--x:0;--y:495;--w:30;--h:50" hidden></button>
        <div id="map-overview" class="map-overview" aria-label="Specific Location and Filter Info" hidden>
          <div class="overview-art" aria-hidden="true"></div>
          <output id="map-filter-status" class="map-filter-status" aria-label="Current map filter" aria-live="polite">ALL</output>
        </div>
        <div id="item-callout" class="item-callout" role="tooltip" hidden>
          <img class="item-callout__art" src="./assets/map/item-callout.svg" alt="" width="335" height="118">
          <svg class="item-callout__label" viewBox="0 0 335 118" aria-hidden="true">
            <defs><clipPath id="name-card-text-clip"><rect x="25" y="21" width="286" height="49"/></clipPath></defs>
            <text id="item-title" x="168" y="45.5" text-anchor="middle" dominant-baseline="central" fill="#F8D24D" stroke="#132D46" stroke-width="2" stroke-linejoin="round" paint-order="stroke fill" clip-path="url(#name-card-text-clip)"></text>
          </svg>
          <span class="visually-hidden" id="item-name-accessible"></span>
        </div>
        <ul id="map-items" class="visually-hidden" aria-label="Visible map items"></ul>
        <div class="map-zoom" role="group" aria-label="Map zoom"><button type="button" data-zoom="in" aria-label="Zoom in">+</button><button type="button" data-zoom="out" aria-label="Zoom out">−</button></div>
        <nav aria-label="Map navigation">
          <button class="art-button nav-button" data-nav="corkboard" aria-label="Home — city board" style="--x:1144;--y:29;--w:72;--h:29;--underline:78"><img src="./assets/map/nav-home.svg" alt="" width="72" height="29"></button>
          <button class="art-button nav-button" data-nav="library" aria-label="Icon Library" style="--x:1230;--y:29;--w:247;--h:29;--underline:195"><img src="./assets/map/nav-library.svg" alt="" width="247" height="29"></button>
        </nav>
      </section>
      <section id="icon-library" class="scene" aria-label="Icon library" tabindex="-1" aria-hidden="true" inert data-figma-node="1:2238">
        <img class="scene__art art-canvas" src="./assets/map/library.svg" width="1512" height="982" alt="Icon library. All cities are selected. A blue collection tray contains cultural symbols, with tabs for Guangzhou, Beijing, Shanghai, Dehong, and Shanxi." decoding="async" draggable="false">
        <nav aria-label="Icon library navigation">
          <button class="art-button nav-button" data-nav="corkboard" aria-label="Home — city board" style="--x:1242;--y:29;--w:72;--h:29;--underline:78"><img src="./assets/map/nav-home.svg" alt="" width="72" height="29"></button>
          <button class="art-button nav-button" data-nav="map" aria-label="Map — return to Guangzhou" style="--x:1386;--y:29;--w:56;--h:29;--underline:62"><img src="./assets/map/nav-map.svg" alt="" width="56" height="29"></button>
        </nav>
      </section>
    </main>
    <dialog id="archive" class="archive" aria-label="Cultural archive book" aria-describedby="archive-help" tabindex="-1">
      <p id="archive-help" class="visually-hidden">Click the cover to open. Click the right page to turn forward or the left page to turn back. Click outside the book or press Escape to close.</p>
      <div class="archive-stage">
        <img class="archive-art" alt="" draggable="false">
        <div class="archive-hit">
          <button type="button" data-page="previous" aria-label="Previous spread"></button>
          <button type="button" data-page="next" aria-label="Next spread"></button>
          <button type="button" data-page="cover" aria-label="Open archive book"></button>
        </div>
      </div>
      <img class="archive-cursor" alt="" aria-hidden="true" hidden>
      <p class="archive-status visually-hidden" role="status" aria-live="polite"></p>
    </dialog>
    <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  </body>
</html>
